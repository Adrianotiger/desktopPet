name: Build DesktopPet Portable - SignPath

on:
  workflow_dispatch:

jobs:

  build:

    strategy:
      matrix:
        configuration: [Release]  #configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: src/DesktopPet_Portable.sln
      Project_Path: src/DesktopPet_Portable.csproj
      Solution_Dir: src/

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install NuGet
      uses: NuGet/setup-nuget@v2
      
    - name: Restore NuGet packages
      run: nuget restore $env:Solution_Name

    - name: Build solution
      run: msbuild $env:Solution_Name -p:Configuration=Release -p:RestorePackages=false

    - name: Install SignPath Module
      shell: pwsh
      run: Install-Module SignPath -Force -Scope CurrentUser

    - name: Sign DesktopPet
      shell: pwsh
      run: Submit-SigningRequest `
        -InputArtifactPath "build/DesktopPetPortable/bin/Release/x64/app.publish/DesktopPet.exe" `
        -ApiToken "${{ secrets.SIGNPATH_API_TOKEN }}" `
        -OrganizationId "dd17bc69-e331-421d-9e86-7fbb26a445d2" `
        -ProjectSlug "desktopPet" `
        -SigningPolicySlug "test-signing" `
        -OutputArtifactPath "signed/DesktopPet.exe" `
        -WaitForCompletion

    - name: Upload unsigned EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: DesktopPet_Portable
        path: build/DesktopPetPortable/bin/Release/x64/
       
    
