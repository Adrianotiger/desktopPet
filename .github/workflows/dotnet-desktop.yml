name: Build DesktopPet Portable

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    env:
      Solution_Name: DesktopPet_Portable.sln
      Project_Path: src/DesktopPet_Portable.csproj

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore NuGet packages
      run: dotnet restore $env:Solution_Name

    - name: Build solution
      run: dotnet build $env:Solution_Name -c Release --no-restore

    - name: Publish portable EXE
      run: dotnet publish $env:Project_Path -c Release -r win-x64 --self-contained true -o publish

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: DesktopPet_Portable
        path: publish/
