name: Build DesktopPet Portable

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    env:
      Solution_Name: DesktopPet_Portable.sln
      Project_Path: DesktopPet_Portable.csproj
      Solution_Dir: src/

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install NuGet
      uses: NuGet/setup-nuget@v2
      
    - name: Restore NuGet packages
      run: dotnet restore src/$env:Solution_Name

    - name: Build solution
      run: dotnet build $env:Solution_Name -c Release --no-restore

    - name: Publish portable EXE
      run: dotnet publish $env:Project_Path -c Release -r win-x64 --self-contained true -o publish

    - name: Build solution
      run: msbuild $env:Solution_Name /p:Configuration=Release

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: DesktopPet_Portable
        path: bin/Release/
